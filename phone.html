<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<script>if(screen.width<=600){location.replace("/"+location.search)}</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pots & Plans on a phone</title>
<style>
  :root { --bg: #fff8f0; --ink: #2b1d14; --soft: #5c4636; --frame: #1b1b1f; }
  html, body { margin: 0; height: 100%; background: var(--bg); font-family: ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, sans-serif; color: var(--ink); }
  body { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; min-height: 100%; padding: 10px 16px 16px; box-sizing: border-box; }
  .phone { position: relative; width: 393px; height: 852px; border-radius: 56px; background: var(--frame); padding: 16px 18px; box-sizing: content-box; box-shadow: 0 30px 60px rgba(43, 29, 20, 0.35), inset 0 0 0 2px #3a3a40; flex: none; }
  .phone::before { content: ''; position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 120px; height: 34px; background: var(--frame); border-radius: 0 0 22px 22px; z-index: 2; }
  .phone .btn { position: absolute; background: #2b2b30; border-radius: 3px; }
  .phone .btn.power { right: -4px; top: 190px; width: 4px; height: 96px; }
  .phone .btn.vol1 { left: -4px; top: 160px; width: 4px; height: 60px; }
  .phone .btn.vol2 { left: -4px; top: 232px; width: 4px; height: 60px; }
  .phone .btn.mute { left: -4px; top: 110px; width: 4px; height: 30px; }
  .screen { position: relative; width: 393px; height: 852px; border-radius: 44px; background: var(--bg); overflow: hidden; display: flex; flex-direction: column; }
  /* The status bar takes the room it does on a real iPhone 15 (59pt), so the app never sits under the notch. Like a real iPhone, the app runs
     to the bottom edge and the home line floats over it; the app keeps its own 34pt home-bar space (see useBottomInset). */
  .status { height: 59px; flex: none; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 30px 10px; font-size: 15px; font-weight: 600; color: var(--ink); }
  .status .icons { display: flex; gap: 6px; align-items: center; }
  .status svg { display: block; }
  iframe { width: 393px; flex: 1; min-height: 0; border: 0; background: #fff; display: block; }
  .home { position: absolute; left: 0; right: 0; bottom: 0; height: 34px; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 3; }
  .home i { display: block; width: 134px; height: 5px; border-radius: 3px; background: var(--ink); opacity: 0.85; }
  .note { font-size: 14px; color: var(--soft); text-align: center; max-width: 420px; line-height: 1.4; }
  .note b { color: var(--ink); }
  .reset { font: inherit; font-size: 15px; font-weight: 700; color: #fff; background: #c2410c; border: 0; border-radius: 999px; padding: 10px 20px; cursor: pointer; box-shadow: 0 4px 12px rgba(194, 65, 12, 0.3); }
  .reset:hover { background: #9a3412; }
  @media (max-height: 980px) { .phone { transform: scale(0.82); transform-origin: top center; margin-bottom: -160px; } }
  @media (max-height: 820px) { .phone { transform: scale(0.72); margin-bottom: -248px; } }
  @media (max-height: 700px) { .phone { transform: scale(0.6); margin-bottom: -354px; } }
</style>
</head>
<body>
  <div class="phone">
    <span class="btn mute"></span><span class="btn vol1"></span><span class="btn vol2"></span><span class="btn power"></span>
    <div class="screen">
      <div class="status">
        <span id="clock">9:41</span>
        <span class="icons">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="#2b1d14"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#2b1d14" stroke-width="1.8" stroke-linecap="round"><path d="M1 4.2a10 10 0 0 1 14 0"/><path d="M3.8 7a6.2 6.2 0 0 1 8.4 0"/><circle cx="8" cy="10" r="1.2" fill="#2b1d14" stroke="none"/></svg>
          <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="#2b1d14" stroke-opacity="0.4"/><rect x="2" y="2" width="18" height="9" rx="2" fill="#2b1d14"/><rect x="25" y="4.5" width="1.5" height="4" rx="0.75" fill="#2b1d14" fill-opacity="0.4"/></svg>
        </span>
      </div>
      <iframe src="/" title="Pots & Plans" allow="clipboard-write; web-share"></iframe>
      <div class="home"><i></i></div>
    </div>
  </div>
  <button class="reset" id="reset" type="button">↺ Start over from sign-in</button>
  <p class="note"><b>Pots & Plans 2.0</b> at iPhone size. Everything you do here is saved on this computer, like it would be on your phone.</p>
<script>
  function tick(){ var d=new Date(); var h=d.getHours()%12||12; var m=('0'+d.getMinutes()).slice(-2); document.getElementById('clock').textContent=h+':'+m; }
  tick(); setInterval(tick, 15000);
  // Start over: wipe everything the demo saved in this browser (the app runs on this same site,
  // so its storage is ours to clear), then load the app fresh at the Welcome screen.
  async function startOver() {
    try { localStorage.clear(); sessionStorage.clear(); } catch (e) {}
    try { if (indexedDB.databases) for (const db of await indexedDB.databases()) indexedDB.deleteDatabase(db.name); } catch (e) {}
    document.querySelector('iframe').src = '/?fresh=' + Date.now();
  }
  document.getElementById('reset').onclick = function () {
    if (confirm('Start over? This erases the account and everything made in this demo.')) startOver();
  };
  // phone.html?reset opens the demo already wiped, then drops ?reset so a refresh doesn't wipe again.
  if (/[?&]reset\b/.test(location.search)) { history.replaceState(null, '', location.pathname); startOver(); }
</script>
</body>
</html>
